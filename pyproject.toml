[project]
name = "coode-bussines-protection"
version = "0.1.0"
description = "Read-only domain security diagnostics for COODE Bussines Protection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dnspython==2.9.2",
    "httpx==0.29.0",
    "reportlab==5.1.2",
]

[dependency-groups]
dev = [
    "pypdf==7.2.0",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
